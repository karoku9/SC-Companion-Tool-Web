<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SC Companion — Wiki Fleet Stats</title>
  <style>
    :root{color-scheme:dark;--bg:#061017;--panel:#0b1a22;--panel2:#102731;--line:#294852;--text:#eef8f9;--muted:#91aab0;--cyan:#62e5ed}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061017,#07151c);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{max-width:1840px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:4px 0;font-size:40px;line-height:1}.muted{color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:8px;text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--cyan)}
    .filters{display:grid;grid-template-columns:2fr repeat(4,minmax(150px,1fr));gap:8px;margin:14px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#071820}
    input,select{width:100%;background:#08171e;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:7px;font:inherit}.summary{grid-column:1/-1;color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(500px,.9fr) minmax(650px,1.3fr);gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .list{max-height:calc(100vh - 220px);overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;z-index:1;background:#12313b;font-size:10px;text-transform:uppercase;letter-spacing:.06em}tr[data-id]{cursor:pointer}tr[data-id]:hover,tr.selected{background:#12313b}.name{font-weight:800}.sub{display:block;color:var(--muted);font-size:11px}
    .detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.detail-head{padding:14px;border-bottom:1px solid var(--line)}.detail-head h2{margin:2px 0;font-size:28px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px}.badge.now{border-color:#2d8f66;color:#8ce3b5}.wiki-link{display:inline-block;margin-top:8px;color:#9ec8ff}
    .status{padding:18px;color:var(--muted)}iframe{display:block;width:100%;min-height:760px;border:0;background:#101416}.note{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    @media(max-width:1100px){.layout{grid-template-columns:1fr}.detail{position:relative;top:auto;max-height:none}.list{max-height:520px}}@media(max-width:760px){.shell{padding:10px}.top{display:block}.actions{margin-top:10px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}h1{font-size:32px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">SC Companion / Star Citizen Wiki</div>
      <h1>Fleet Stats</h1>
      <p class="muted">La lista arriva dall’API veicoli. La scheda a destra mostra il blocco <b>Stats</b> originale dell’infobox Wiki, senza ricalcolare o reinterpretare i valori.</p>
    </div>
    <div class="actions">
      <a class="btn" href="./">← Hauling tool</a>
      <button class="btn" id="refresh">Aggiorna dati</button>
    </div>
  </header>

  <section class="filters">
    <input id="q" placeholder="Corsair, RSI, gunship…">
    <select id="maker"><option value="">Tutti i produttori</option></select>
    <select id="role"><option value="">Tutti i ruoli</option></select>
    <select id="sale"><option value="all">Tutte</option><option value="now">Acquistabili ora</option><option value="last">Ultimo prezzo noto</option></select>
    <select id="cargo"><option value="0">Qualsiasi cargo</option><option value="24">24+ SCU</option><option value="72">72+ SCU</option><option value="100">100+ SCU</option></select>
    <div class="summary" id="summary">Caricamento…</div>
  </section>

  <div class="layout">
    <section class="panel list">
      <table>
        <thead><tr><th>Nave</th><th>Ruolo</th><th>Prezzo aUEC</th><th>SCU</th><th>Size</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5">Caricamento…</td></tr></tbody>
      </table>
    </section>
    <aside class="panel detail" id="detail"><div class="status">Seleziona una nave.</div></aside>
  </div>
</div>
<script src="fleet-wiki-render.js?v=1"></script>
<script src="fleet-wiki.js?v=3"></script>
</body>
</html>
