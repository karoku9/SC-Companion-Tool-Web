<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>SC Companion — Wiki Fleet Stats</title><style>
:root{color-scheme:dark;--b:#071017;--p:#0c1b23;--l:#294750;--t:#eef7f8;--m:#91a9af;--c:#62e5ed}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.shell{max-width:1800px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{margin:4px 0;font-size:38px}.muted{color:var(--m)}a{color:var(--c)}button,input,select{font:inherit}.btn{border:1px solid var(--l);background:#102630;color:var(--t);padding:9px 12px;border-radius:7px;text-decoration:none;cursor:pointer}.bar{position:sticky;top:0;z-index:3;background:#071017f2;border:1px solid var(--l);padding:10px;border-radius:10px;margin:14px 0}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px}input,select{width:100%;background:#08161d;color:var(--t);border:1px solid var(--l);padding:9px;border-radius:6px}.layout{display:grid;grid-template-columns:minmax(500px,.85fr) minmax(620px,1.35fr);gap:12px}.panel{background:var(--p);border:1px solid var(--l);border-radius:10px;overflow:hidden}.list{max-height:calc(100vh - 205px);overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#12303a;font-size:10px;text-transform:uppercase}tr[data-id]{cursor:pointer}tr[data-id]:hover,tr.sel{background:#12303a}.name{font-weight:800}.sub{display:block;font-size:11px;color:var(--m)}.detail{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}.head{padding:14px;border-bottom:1px solid var(--l)}.head h2{margin:3px 0;font-size:27px}.stats{padding:10px}.stats iframe{width:100%;min-height:760px;border:0;background:white}.status{padding:11px 14px;color:var(--m)}.note{padding:10px 14px;border-top:1px solid var(--l);color:var(--m)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.detail{position:relative;top:auto;max-height:none}.list{max-height:500px}}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.shell{padding:10px}header{display:block}}
</style></head><body><div class="shell"><header><div><div class="muted">SC Companion / Star Citizen Wiki</div><h1>Fleet Stats</h1><p class="muted">Le statistiche non vengono calcolate qui: ogni scheda carica direttamente la sezione <b>Stats</b> generata dalla Wiki.</p></div><div><a class="btn" href="./">← Hauling tool</a> <button class="btn" id="refresh">Aggiorna</button></div></header><div class="bar"><div class="filters"><input id="q" placeholder="Corsair, RSI, gunship…"><select id="maker"><option value="">Tutti i produttori</option></select><select id="role"><option value="">Tutti i ruoli</option></select><select id="sale"><option value="all">Tutte</option><option value="now">Acquistabili ora</option><option value="last">Ultimo prezzo noto</option></select><select id="cargo"><option value="0">Qualsiasi cargo</option><option value="24">24+ SCU</option><option value="72">72+ SCU</option><option value="100">100+ SCU</option></select></div><div id="summary" class="muted" style="margin-top:8px">Caricamento…</div></div><div class="layout"><section class="panel list"><table><thead><tr><th>Nave</th><th>Ruolo</th><th>Prezzo aUEC</th><th>SCU</th><th>Size</th></tr></thead><tbody id="rows"><tr><td colspan="5">Caricamento…</td></tr></tbody></table></section><aside class="panel detail" id="detail"><div class="status">Seleziona una nave.</div></aside></div></div><script>
'use strict';(()=>{const V='https://api.star-citizen.wiki/api/vehicles',W='https://starcitizen.tools/api.php',CK='fleet-wiki-list-v1',WK='fleet-wiki-page-v1:',H=6*3600e3,L={'Corsair':6224400,'Constellation Andromeda':9652608,'Constellation Aquila':11577384,'Constellation Taurus':7641648,'Constellation Phoenix':14076720,'600i Explorer':27231750,'400i':8398063,'Carrack':34398000,'890 Jump':62088392,'Caterpillar':11850300,'C2 Hercules Starlifter':18900000,'M2 Hercules Starlifter':28009800,'A2 Hercules Starlifter':37800200,'Starfarer Gemini':14244300,'Starlancer MAX':12127500,'Starlancer TAC':13381200,'Redeemer':9803430,'Reclaimer':30164400,'Hull C':16537500,'Cutlass Black':2010960,'C1 Spirit':3118500,'Zeus Mk II CL':6463800,'Zeus Mk II ES':4201470,'Vanguard Warden':7354900,'Vanguard Sentinel':7776700,'Vanguard Harbinger':8200400,'Scorpius':5171040,'Ares Ion':4725000,'Ares Inferno':4725000,'Eclipse':7541100,'Retaliator':7541100,'Paladin':15876000,'Asgard':17860500,'Valkyrie':19845000,'Prospector':2926350,'Vulture':2646000,'MOLE':8946000,'Nomad':1512000,'Freelancer MAX':4252500};let S={all:[],f:[],sel:null};const $=x=>document.querySelector(x),n=x=>Number.isFinite(Number(x))?Number(x):null,e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),loc=x=>Array.isArray(x)?x.map(loc).filter(Boolean).join(' / '):typeof x==='string'?x:x?.it_IT||x?.en_EN||x?.en||x?.name||'',fmt=x=>n(x)===null?'—':Math.round(Number(x)).toLocaleString('it-IT');
function role(r){return loc(r.role)||loc(r.career)||loc(r.type)||loc(r.foci?.[0])||'Speciale'}function norm(x){return String(x||'').replace(/^(Aegis|Anvil|Drake|MISC|Mirai|Origin|RSI|Crusader|ARGO|Aopoa|Esperia|Gatac)\s+/i,'').trim()}function last(x){if(L[x])return L[x];let y=norm(x),k=Object.keys(L).find(z=>norm(z)===y);return k?L[k]:null}function one(r){let p=(r.uex_prices?.purchase||[]).map(x=>n(x.price_buy)).filter(x=>x>0),name=r.shipmatrix_name||r.name||r.game_name;return{id:String(r.uuid||r.class_name||r.slug||name),name,maker:r.manufacturer?.name||loc(r.manufacturer),role:role(r),ship:r.is_spaceship===true||r.is_spaceship===1,status:loc(r.production_status).toLowerCase().replace(/[\s_-]/g,''),size:n(r.size_class),cargo:n(r.cargo_capacity)||0,price:p.length?Math.min(...p):null}}function av(v){return v.price?{k:'now',p:v.price}:{k:'last',p:last(v.name)}}
async function vehicles(){let out=[];for(let i=1;i<=10;i++){let u=new URL(V);u.searchParams.set('page[size]','200');u.searchParams.set('page[number]',i);let r=await fetch(u),j=await r.json(),b=Array.isArray(j)?j:j.data||[];out.push(...b);if(b.length<200)break}return out}function clean(a){let m=new Map;for(let r of a){let v=one(r),x=av(v);if(!v.ship||!v.size||!x.p)continue;if(v.status&&!v.status.includes('flightready')&&!v.status.includes('flyable'))continue;if(/best in show|pirate edition|emerald|executive edition|heartseeker|renegade|valiant|comet/i.test(v.name))continue;if(!m.has(v.name)||v.price)m.set(v.name,v)}return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'it'))}
function filters(){let ms=[...new Set(S.all.map(x=>x.maker).filter(Boolean))].sort(),rs=[...new Set(S.all.map(x=>x.role).filter(Boolean))].sort();$('#maker').innerHTML='<option value="">Tutti i produttori</option>'+ms.map(x=>`<option>${e(x)}</option>`).join('');$('#role').innerHTML='<option value="">Tutti i ruoli</option>'+rs.map(x=>`<option>${e(x)}</option>`).join('')}function apply(){let q=$('#q').value.toLowerCase(),m=$('#maker').value,r=$('#role').value,s=$('#sale').value,c=+$('#cargo').value;S.f=S.all.filter(v=>{let a=av(v),h=`${v.name} ${v.maker} ${v.role}`.toLowerCase();return(!q||h.includes(q))&&(!m||v.maker===m)&&(!r||v.role===r)&&(s==='all'||a.k===s)&&v.cargo>=c});$('#summary').textContent=`${S.f.length} navi visibili su ${S.all.length}`;$('#rows').innerHTML=S.f.map(v=>{let a=av(v);return`<tr data-id="${e(v.id)}" class="${S.sel?.id===v.id?'sel':''}"><td class="name">${e(v.name)}<span class="sub">${e(v.maker)}</span></td><td>${e(v.role)}</td><td>${a.k==='now'?'Ora':'Ultimo noto'} · ${fmt(a.p)}</td><td>${fmt(v.cargo)}</td><td>S${fmt(v.size)}</td></tr>`}).join('')||'<tr><td colspan="5">Nessun risultato.</td></tr>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function abs(root){root.querySelectorAll('[href]').forEach(x=>{let h=x.getAttribute('href');if(!h||h.startsWith('#'))return;try{x.href=new URL(h,'https://starcitizen.tools/').href}catch{}x.target='_blank'});root.querySelectorAll('[src]').forEach(x=>{try{x.src=new URL(x.getAttribute('src'),'https://starcitizen.tools/').href}catch{}});root.querySelectorAll('script,style,.mw-editsection').forEach(x=>x.remove())}function score(x){let t=x.textContent||'';return['Overview','Offense','Defense','Mobility','Travel','Stealth'].filter(y=>t.includes(y)).length}function extract(h){let d=new DOMParser().parseFromString(h,'text/html'),best=null,bs=0;for(let l of [...d.querySelectorAll('*')].filter(x=>x.children.length<6&&x.textContent.trim()==='Stats')){for(let x=l,k=0;x&&k<9;x=x.parentElement,k++){let s=score(x),z=(x.textContent||'').length;if(s>bs&&z<50000){best=x;bs=s}}}if(!best)for(let x of d.querySelectorAll('section,div,aside')){let s=score(x),z=(x.textContent||'').length;if(s>bs&&z<50000){best=x;bs=s}}if(!best||bs<4)return null;let c=best.cloneNode(true);abs(c);return c.innerHTML}function srcdoc(name,html,mods){let u=mods.length?`https://starcitizen.tools/load.php?lang=en&modules=${encodeURIComponent([...new Set(mods)].join('|'))}&only=styles&skin=vector-2022`:'';return`<!doctype html><html><head><meta charset="utf-8"><base href="https://starcitizen.tools/">${u?`<link rel="stylesheet" href="${u}">`:''}<style>html{background:#101416;color:#eee;font:14px system-ui}body{margin:0;padding:12px}a{color:#58c9e8}.infobox,.portable-infobox{width:100%!important;max-width:none!important;float:none!important;margin:0!important}.mw-editsection{display:none!important}img{max-width:100%}</style><title>${e(name)}</title></head><body><main class="mw-parser-output">${html}</main></body></html>`}
async function wiki(v,force=false){let k=WK+v.name;if(!force)try{let c=JSON.parse(localStorage.getItem(k)||'null');if(c&&Date.now()-c.t<H)return c.d}catch{}let u=new URL(W);u.searchParams.set('action','parse');u.searchParams.set('page',v.name);u.searchParams.set('prop','text|modules|modulestyles|revid');u.searchParams.set('format','json');u.searchParams.set('formatversion','2');u.searchParams.set('origin','*');let r=await fetch(u),j=await r.json();if(j.error)throw Error(j.error.info);let h=extract(j.parse?.text||'');if(!h)throw Error('Sezione Stats non trovata');let d={h,rev:j.parse?.revid,mods:[...(j.parse?.modules||[]),...(j.parse?.modulestyles||[])]};localStorage.setItem(k,JSON.stringify({t:Date.now(),d}));return d}async function select(id){let v=S.all.find(x=>x.id===id);if(!v)return;S.sel=v;apply();let a=av(v);$('#detail').innerHTML=`<div class="head"><div class="muted">${e(v.maker)} / ${e(v.role)}</div><h2>${e(v.name)}</h2><div>${a.k==='now'?'Ora':'Ultimo noto'} · ${fmt(a.p)} aUEC · ${fmt(v.cargo)} SCU · S${fmt(v.size)} · <a href="https://starcitizen.tools/${encodeURIComponent(v.name.replaceAll(' ','_'))}" target="_blank">Wiki ↗</a></div></div><div class="status" id="st">Caricamento Stats originali…</div><div class="stats" id="stats"></div><div class="note">Nessun punteggio o dato viene ricalcolato dal tool.</div>`;try{let d=await wiki(v);if(S.sel?.id!==v.id)return;$('#st').textContent=`Star Citizen Wiki · revisione ${d.rev||'corrente'}`;let f=document.createElement('iframe');f.srcdoc=srcdoc(v.name,d.h,d.mods);f.title=`Stats Wiki ${v.name}`;$('#stats').append(f);f.onload=()=>{try{f.style.height=Math.max(760,f.contentDocument.documentElement.scrollHeight+20)+'px'}catch{}}}catch(err){$('#st').innerHTML=`Errore: ${e(err.message)}. <a href="https://starcitizen.tools/${encodeURIComponent(v.name.replaceAll(' ','_'))}" target="_blank">Apri la Wiki ↗</a>`}}
async function load(force=false){try{let raw=null;if(!force)try{let c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&Date.now()-c.t<H)raw=c.d}catch{}if(!raw){raw=await vehicles();localStorage.setItem(CK,JSON.stringify({t:Date.now(),d:raw}))}S.all=clean(raw);filters();apply();let v=S.all.find(x=>x.name==='Corsair')||S.all[0];if(v)select(v.id)}catch(err){$('#rows').innerHTML=`<tr><td colspan="5">Errore: ${e(err.message)}</td></tr>`}}['q','maker','role','sale','cargo'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',apply));$('#refresh').onclick=()=>{localStorage.removeItem(CK);load(true)};load()})();
</script></body></html>
